[package]
name = "quantum_bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "quantum_bridge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22.0", features = ["extension-module", "abi3-py310"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8"
flume = "0.11"
parking_lot = "0.12"
numpy = "0.22.0"
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
futures-util = "0.3"
lazy_static = "1.4.0"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
