[workspace]
resolver = "2"
members = [
    "crates/os-guardian",
    "crates/quantum-arena",
    "crates/feature-engine",
    "crates/signal-engine",
    "crates/risk-engine",
    "crates/execution-engine",
    "crates/data-pipeline", "crates/evolution-engine", "crates/telemetry-server",
]

[package]
name = "trader-gemini-v5"
version = "0.1.0"
authors = ["Trader Gemini"]
edition = "2021"
default-run = "trader-gemini-v5"

[dependencies]
dotenvy = "0.15"
os-guardian = { path = "crates/os-guardian" }
quantum-arena = { path = "crates/quantum-arena" }
feature-engine = { path = "crates/feature-engine" }
signal-engine = { path = "crates/signal-engine" }
risk-engine = { path = "crates/risk-engine" }
execution-engine = { path = "crates/execution-engine" }
data-pipeline = { path = "crates/data-pipeline" }
evolution-engine = { path = "crates/evolution-engine" }
telemetry-server = { path = "crates/telemetry-server" }
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
futures-util = "0.3"
url = "2.4"
lazy_static = "1.4"
memmap2 = "0.9"
chrono = "0.4"
csv = "1.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
simd-json = "0.17.0"
zip = "0.6"
itoa = "1.0.18"
ryu = "1.0.23"
crossbeam-channel = "0.5.15"

[[bin]]
name = "config_compiler"
path = "src/bin/config_compiler.rs"

[[bin]]
name = "quantum_benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "god_engine"
path = "src/bin/god_engine.rs"

[[bin]]
name = "evolution_engine"
path = "src/bin/evolution.rs"

[[bin]]
name = "multi_fidelity"
path = "src/bin/multi_fidelity.rs"
[[bin]]
name = "data_loader"
path = "src/bin/data_loader.rs"


[[bin]]
name = "train_nano_forest"
path = "src/bin/train_nano_forest.rs"

[[bin]]
name = "csv_to_bin"
path = "src/bin/csv_to_bin.rs"

[[bin]]
name = "csv_to_bin_ticks"
path = "src/bin/csv_to_bin_ticks.rs"

[[bin]]
name = "downloader"
path = "src/bin/downloader.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "quantum_engine"
crate-type = ["cdylib", "staticlib", "rlib"]
