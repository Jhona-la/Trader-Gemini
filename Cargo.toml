[workspace]
resolver = "2"
members = [
    "crates/os-guardian",
    "crates/quantum-arena",
    "crates/feature-engine",
    "crates/signal-engine",
    "crates/risk-engine",
    "crates/execution-engine",
]

[package]
name = "quantum_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "quantum_engine"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

tokio = { version = "1.32", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
url = "2.4"
lazy_static = "1.4"
memmap2 = "0.9"
chrono = "0.4"
csv = "1.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
simd-json = "0.17.0"
zip = "0.6"
itoa = "1.0.18"
ryu = "1.0.23"
crossbeam-channel = "0.5.15"

[[bin]]
name = "config_compiler"
path = "src/bin/config_compiler.rs"

[[bin]]
name = "god_engine"
path = "src/bin/god_engine.rs"

[[bin]]
name = "evolution_engine"
path = "src/bin/evolution.rs"

[[bin]]
name = "multi_fidelity"
path = "src/bin/multi_fidelity.rs"
[[bin]]
name = "data_loader"
path = "src/bin/data_loader.rs"


[[bin]]
name = "train_nano_forest"
path = "src/bin/train_nano_forest.rs"

[[bin]]
name = "csv_to_bin"
path = "src/bin/csv_to_bin.rs"

[[bin]]
name = "csv_to_bin_ticks"
path = "src/bin/csv_to_bin_ticks.rs"

[[bin]]
name = "downloader"
path = "src/bin/downloader.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
