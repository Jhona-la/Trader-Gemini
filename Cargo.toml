[workspace]
resolver = "2"
members = [
    "crates/os-guardian",
    "crates/quantum-arena",
    "crates/feature-engine",
    "crates/signal-engine",
    "crates/risk-engine",
    "crates/execution-engine",
    "crates/data-pipeline",
]

[package]
name = "trader-gemini-v5"
version = "0.1.0"
edition = "2021"
default-run = "trader-gemini-v5"

[dependencies]
os-guardian = { path = "crates/os-guardian" }
quantum-arena = { path = "crates/quantum-arena" }
feature-engine = { path = "crates/feature-engine" }
signal-engine = { path = "crates/signal-engine" }
risk-engine = { path = "crates/risk-engine" }
execution-engine = { path = "crates/execution-engine" }
data-pipeline = { path = "crates/data-pipeline" }
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "config_compiler"
path = "src/bin/config_compiler.rs"

[[bin]]
name = "god_engine"
path = "src/bin/god_engine.rs"

[[bin]]
name = "evolution_engine"
path = "src/bin/evolution.rs"

[[bin]]
name = "multi_fidelity"
path = "src/bin/multi_fidelity.rs"
[[bin]]
name = "data_loader"
path = "src/bin/data_loader.rs"


[[bin]]
name = "train_nano_forest"
path = "src/bin/train_nano_forest.rs"

[[bin]]
name = "csv_to_bin"
path = "src/bin/csv_to_bin.rs"

[[bin]]
name = "csv_to_bin_ticks"
path = "src/bin/csv_to_bin_ticks.rs"

[[bin]]
name = "downloader"
path = "src/bin/downloader.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
