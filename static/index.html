<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Dashboard: 10D Quantum Tensors</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="container">
        <header class="glass-panel">
            <h1><span class="neon-text">OMNI</span> QUANTUM DASHBOARD</h1>
            <div class="capital-display">
                <span class="label">Asymmetric Capital</span>
                <span class="value" id="capital">$13.00</span>
            </div>
            <div class="latency-display">
                <span class="label">Engine Latency</span>
                <span class="value" id="latency">0 ns</span>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- 10D Tensors -->
            <section class="glass-panel tensors-panel">
                <h2>10D STATE TENSORS</h2>
                <div class="tensor-bars">
                    <div class="tensor-item">
                        <span class="t-label">Price Δ</span>
                        <div class="bar-bg"><div class="bar-fill" id="t0"></div></div>
                        <span class="t-val" id="tv0">0.0</span>
                    </div>
                    <div class="tensor-item">
                        <span class="t-label">Fast EMA Dist</span>
                        <div class="bar-bg"><div class="bar-fill" id="t1"></div></div>
                        <span class="t-val" id="tv1">0.0</span>
                    </div>
                    <div class="tensor-item">
                        <span class="t-label">Slow EMA Dist</span>
                        <div class="bar-bg"><div class="bar-fill" id="t2"></div></div>
                        <span class="t-val" id="tv2">0.0</span>
                    </div>
                    <div class="tensor-item">
                        <span class="t-label">Velocity (Vt)</span>
                        <div class="bar-bg"><div class="bar-fill" id="t3"></div></div>
                        <span class="t-val" id="tv3">0.0</span>
                    </div>
                    <div class="tensor-item">
                        <span class="t-label">OBI Velocity</span>
                        <div class="bar-bg"><div class="bar-fill" id="t4"></div></div>
                        <span class="t-val" id="tv4">0.0</span>
                    </div>
                    <div class="tensor-item">
                        <span class="t-label">OBI Accel</span>
                        <div class="bar-bg"><div class="bar-fill" id="t5"></div></div>
                        <span class="t-val" id="tv5">0.0</span>
                    </div>
                    <div class="tensor-item">
                        <span class="t-label">Fund. Elasticity</span>
                        <div class="bar-bg"><div class="bar-fill" id="t6"></div></div>
                        <span class="t-val" id="tv6">0.0</span>
                    </div>
                    <div class="tensor-item">
                        <span class="t-label">C-VPIN Net</span>
                        <div class="bar-bg"><div class="bar-fill" id="t7"></div></div>
                        <span class="t-val" id="tv7">0.0</span>
                    </div>
                    <div class="tensor-item">
                        <span class="t-label">Shannon Entropy</span>
                        <div class="bar-bg"><div class="bar-fill" id="t8"></div></div>
                        <span class="t-val" id="tv8">0.0</span>
                    </div>
                    <div class="tensor-item">
                        <span class="t-label">Dark Alpha Panic</span>
                        <div class="bar-bg"><div class="bar-fill" id="t9"></div></div>
                        <span class="t-val" id="tv9">0.0</span>
                    </div>
                </div>
            </section>

            <!-- Logs -->
            <section class="glass-panel logs-panel">
                <h2>EXECUTION TELEMETRY</h2>
                <div class="terminal" id="logs">
                    <!-- Logs go here -->
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
