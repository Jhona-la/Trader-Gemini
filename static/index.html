<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Engine - Terminal L3</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="matrix-grid">
        <!-- HEADER -->
        <header class="panel header-panel">
            <h1><span class="neon-green">GOD ENGINE</span> // L3 MATRIX</h1>
            <div class="status-indicator">
                <div class="led pulse-green" id="ws-led"></div>
                <span id="ws-status">TELEMETRY LINK: ONLINE</span>
            </div>
        </header>

        <!-- CAPITAL ODOMETER -->
        <div class="panel capital-panel">
            <h2>UNIFIED CAPITAL</h2>
            <div class="odometer-container">
                <span class="currency">$</span>
                <span class="value" id="capital-val">13.000000</span>
            </div>
            <div class="pnl-stats">
                <div class="stat-box">
                    <span class="label">SCALP PNL</span>
                    <span class="val green" id="scalp-pnl">0.0000</span>
                </div>
                <div class="stat-box">
                    <span class="label">SWING PNL</span>
                    <span class="val green" id="swing-pnl">0.0000</span>
                </div>
            </div>
        </div>

        <!-- DARK ALPHA CASCADE -->
        <div class="panel alpha-panel">
            <h2>DARK ALPHA RISK (MEV)</h2>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="alpha-bar"></div>
            </div>
            <div class="alpha-metric">
                <span id="alpha-val">0.00%</span>
                <span class="alert-flag" id="alpha-alert">SAFE</span>
            </div>
        </div>

        <!-- LATENCY RADAR -->
        <div class="panel latency-panel">
            <h2>EXECUTION LATENCY</h2>
            <div class="latency-display">
                <span class="nano-val" id="latency-val">0</span>
                <span class="nano-unit">ns</span>
            </div>
            <canvas id="latency-canvas" width="400" height="150"></canvas>
            <div class="latency-panic" id="latency-panic">
                STABLE
            </div>
        </div>

        <!-- ML TENSORS -->
        <div class="panel tensor-panel">
            <h2>NANO-FOREST TENSORS</h2>
            <div class="tensor-grid" id="tensor-grid">
                <!-- Javascript will populate 10 bars -->
            </div>
        </div>

        <!-- TERMINAL LOGS -->
        <div class="panel log-panel">
            <h2>>_ SYSTEM_LOGS</h2>
            <div class="log-container" id="log-container">
                <div class="log-line"><span class="timestamp">[00:00:00]</span> <span class="info">Terminal Initialized.</span></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
