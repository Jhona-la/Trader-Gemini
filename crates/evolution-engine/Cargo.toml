[package]
name = "evolution-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
backtest-engine = { version = "0.1.0", path = "../backtest-engine" }
god-engine-core = { version = "0.1.0", path = "../god-engine-core" }
polars = { version = "0.43.1", features = ["lazy", "dtype-datetime", "performant", "chunked_ids", "rolling_window"] }
quantum-arena = { path = "../quantum-arena" }
rand = "0.10.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.37.0", features = ["time", "rt", "fs", "macros"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
