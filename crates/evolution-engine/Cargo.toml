[package]
name = "evolution-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
backtest-engine = { version = "0.1.0", path = "../backtest-engine" }
god-engine-core = { version = "0.1.0", path = "../god-engine-core" }
polars = { version = "0.43.1", features = ["lazy", "dtype-datetime", "performant", "chunked_ids", "rolling_window"] }
quantum-arena = { path = "../quantum-arena" }
rand = "0.10.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.37.0", features = ["time", "rt", "fs", "macros"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
storage-engine = { path = "../storage-engine" }
os-guardian = { path = "../os-guardian" }
telemetry-server = { path = "../telemetry-server" }
signal-engine = { path = "../signal-engine" }
parking_lot = "0.12.1"
regex = "1.11.1"
strategy-core = { version = "0.1.0", path = "../strategy-core" }
smartcore = { version = "0.3.2", features = ["serde"] }
dark-alpha-engine = { path = "../dark-alpha-engine" }
data-pipeline = { path = "../data-pipeline" }
arc-swap = "1.9.2"
metacortex-engine = { path = "../metacortex-engine" }
