[package]
name = "backtest-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
god-engine-core = { path = "../god-engine-core" }
data-pipeline = { path = "../data-pipeline" }
quantum-arena = { path = "../quantum-arena" }
signal-engine = { path = "../signal-engine" }
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"], default-features = false }
risk-engine = { path = "../risk-engine" }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
mimalloc = "0.1.52"

# GLM 155: sólo tests (vehículo de medición mps_entrelazamiento_medicion).
[dev-dependencies]
feature-engine = { path = "../feature-engine" }
