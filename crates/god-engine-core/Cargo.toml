[package]
name = "god-engine-core"
version = "0.1.0"
edition = "2024"

[dependencies]
quantum-arena = { path = "../quantum-arena" }
signal-engine = { path = "../signal-engine" }
risk-engine = { path = "../risk-engine" }
telemetry-server = { path = "../telemetry-server" }
feature-engine = { path = "../feature-engine" }
telemetry-engine = { path = "../telemetry-engine" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.37", features = ["full"] }
lazy_static = "1.4"
serde_json = "1.0"
arc-swap = "1.7.1"
rand = "0.10.1"
rayon = "1.12.0"
dark-alpha-engine = { path = "../dark-alpha-engine" }
audit-engine = { version = "0.1.0", path = "../audit-engine" }
reqwest = { version = "0.11", features = ["blocking", "json"] }
data-pipeline = { path = "../data-pipeline" }
strategy-core = { path = "../strategy-core" }
storage-engine = { path = "../storage-engine" }
metacortex-engine = { path = "../metacortex-engine" }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["memoryapi", "minwindef", "basetsd", "winnt", "processthreadsapi"] }
