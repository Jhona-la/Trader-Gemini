[package]
name = "metacortex-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2.0", features = ["full", "visit-mut", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libloading = "0.8"
memmap2 = "0.9"
rkyv = { version = "0.7", features = ["validation"] }
walkdir = "2.5"
tempfile = "3.10"
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
lazy_static = "1.4"
storage-engine = { path = "../storage-engine" }
