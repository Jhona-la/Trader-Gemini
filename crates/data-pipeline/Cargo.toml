[package]
name = "data-pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quantum-arena = { path = "../quantum-arena" }
futures-util = "0.3.30"
url = "2.5.0"
fast-float = "0.2.0"
reqwest = { version = "0.13.4", features = ["json"] }
memchr = "2.8.2"
bincode = "1.3"
polars = { version = "0.43.1", features = ["parquet"] }
zip = "8.6.0"
csv = "1.4.0"
yahoo_finance_api = "4.1.1"



