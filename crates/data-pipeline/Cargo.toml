[package]
name = "data-pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process"] }
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quantum-arena = { path = "../quantum-arena" }
futures-util = "0.3.30"
url = "2.5.0"
fast-float = "0.2.0"
reqwest = { version = "0.11", features = ["json"] }
memchr = "2.8.2"
socket2 = "0.5"
hickory-resolver = "0.24.1"
storage-engine = { path = "../storage-engine" }
memmap2 = "0.9.11"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
