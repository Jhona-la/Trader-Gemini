[package]
name = "os-guardian"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_Security",
] }
lazy_static = "1.4"
libc = "0.2"
winapi = { version = "0.3", features = ["memoryapi", "processthreadsapi", "errhandlingapi", "jobapi2", "psapi"] }
sysinfo = "0.39.6"
quantum-arena = { path = "../quantum-arena" }
telemetry-engine = { path = "../telemetry-engine" }
