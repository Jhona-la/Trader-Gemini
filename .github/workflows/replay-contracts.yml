name: Replay contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-contracts:
    runs-on: windows-2022
    # LX (GLM, 2026-09-30): 45 → 90. El CX verde tardó 26m; el ciclo 7 de
    # Claude (PR#26) y el MP (PR#25) golpearon el techo de 45m y fueron
    # CANCELADOS mid-test (anotación "exceeded the maximum execution time"),
    # no fallaron tests. La suite creció (~1861 locales); el espíritu del
    # workflow (CX, Codex) se conserva — sólo se le da aire.
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout candidate merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
          fetch-depth: 2 # first parent is required for the candidate diff check
      - name: Normalize trailing newlines in text files touched by the candidate
        # XC (GLM, 2026-10-06): 4 blank-line-at-EOF failures in 2 days (Omega9,
        # GLM, Qoder x2) each turned main red for a full runner cycle. The
        # whitespace guard below still rejects conflict markers; this step only
        # normalizes the FINAL newline of text files changed by the candidate
        # so an append-only log file cannot fail the build on cosmetics.
        run: |
          $files = git diff --name-only HEAD^ HEAD
          foreach ($f in $files) {
            if ((Test-Path $f) -and ($f -match '\.(md|json|ya?ml|toml|rs|txt)$')) {
              $content = [System.IO.File]::ReadAllText($f)
              $normalized = $content.TrimEnd("`r`n") + "`n"
              if ($normalized -ne $content) {
                [System.IO.File]::WriteAllText($f, $normalized)
                Write-Host "normalized trailing newline: $f"
              }
            }
          }
          git diff --quiet || (git config user.name ci; git config user.email ci@local; git add -u; git commit -m "ci: normalize trailing newlines [skip ci]")
      - name: Reject conflict markers and whitespace errors in candidate diff
        run: git diff --check HEAD^ HEAD
      - name: Install the compiler used for the local regression
        run: |
          rustup toolchain install nightly-2026-06-30 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +nightly-2026-06-30 --version
          rustc +nightly-2026-06-30 --version
      - name: Check all workspace targets
        run: cargo +nightly-2026-06-30 check --workspace --all-targets --locked
      - name: Model publication and loader contracts
        # Synthetic models only. No real-model inventory, training or promotion.
        run: cargo +nightly-2026-06-30 test -p god-engine-core --locked --test model_publication_contract --test ml_model_contract --test ml_base_publication_contract -- --test-threads=1

      - name: Model inventory structural evidence contracts
        # Synthetic files only; no training, promotion or live-model loading.
        run: cargo +nightly-2026-06-30 test -p god-engine-core --locked --lib ml_registry::tests -- --test-threads=1
      - name: Replay, causality, metrics, labels and risk regressions
        # No --ignored: do not run manual real-tape experiments or exchange tests.
        run: cargo +nightly-2026-06-30 test -p backtest-engine --locked --lib --test ex_post_metrics_contract --test label_evidence_contract --test spectral_risk_contract --test bt_vivo_parity_audit -- --test-threads=1
      - name: Fast genome measurement contracts (not the full T-1 oracle)
        run: cargo +nightly-2026-06-30 test -p backtest-engine --locked --test t1_measurement_contract -- --test-threads=1
      - name: Execution, audit and data-ingest contract suites
        # XC (GLM, 2026-10-06, F8-A-H2 of the exhaustive sweep): these 5
        # crates had 223 tests that CI only COMPILED (--all-targets) but
        # never ran — ioc_fill_contract was red in HEAD for days, invisible.
        # Fast unit/contract suites (no --ignored: no testnet, no manual
        # measurements); adds ~2-4 min against the ~46 min replay suite.
        run: cargo +nightly-2026-06-30 test -p execution-engine -p audit-engine -p data-pipeline -p data-ingest -p dark-alpha-engine --locked -- --test-threads=1
