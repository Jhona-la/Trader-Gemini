name: T3 synthetic model

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/backtest-engine/tests/support/t3_synthetic.rs'
      - '.github/workflows/t3-model.yml'
  push:
    branches: [main]
    paths:
      - 'crates/backtest-engine/tests/support/t3_synthetic.rs'
      - '.github/workflows/t3-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (node24)
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install nightly-2026-06-30 --profile minimal
      - name: Reference model contracts without the trading engine
        shell: pwsh
        run: |
          rustc +nightly-2026-06-30 --edition=2024 --test crates/backtest-engine/tests/support/t3_synthetic.rs -o t3-model-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./t3-model-tests.exe --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
