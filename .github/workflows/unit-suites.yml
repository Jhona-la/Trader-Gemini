name: Unit and contract suites

# QS-1 (Claude, 2026-10-10). `Replay contracts` ejecuta una selección de
# suites; el resto sólo se COMPILA (`check --all-targets`). Medido sobre
# main 8c45fcdf: de 116 ficheros `tests/*.rs` en estos siete crates corrían
# ~12, y no corría ningún test unitario de risk-engine, quantum-arena,
# signal-engine, feature-engine, metacortex-engine ni strategy-core, ni los
# contratos del entrenador (`train_forest`, XLIV-13 + QS-2). Los «contratos
# formales» de cada ola sólo protegen si alguien los ejecuta.
#
# Job aparte y en paralelo: no alarga el de replay (techo de 90 min) ni toca
# su fichero. Mismo compilador fijado, `--locked` y `--test-threads=1` (hay
# tests con estado global: XLIV-12, F8 «mutación de estado global»).
# Sin `--ignored`: nada de red, testnet, tapes reales ni el oráculo T-1.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      # F-H2 (Fable, 2026-10-17): un push de SOLO documentación (buzón,
      # AGENT_SYNC, TABLERO, MEMORIA, planes, tablas de auditoría, grafo)
      # no cambia ningún binario y no debe gastar un runner Windows durante
      # hasta 90 min. Medido 2026-10-17: la mayoría de los 33 pushes a main
      # eran de documentación. Si un commit mezcla docs y código, corre.
      - '**/*.md'
      - 'docs/**'
      - '**/*.tsv'
      - 'graphify-out/**'
      - 'outputs/**'
      - '.agents/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.tsv'
      - 'graphify-out/**'
      - 'outputs/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-suites-${{ github.event.pull_request.number || github.ref }}
  # En PRs, un push nuevo sustituye al anterior. En main NO se cancela: con
  # cancelación, una ráfaga de pushes deja main sin ninguna corrida completa
  # (2026-10-10: #704, #705 y #706 cancelados; main rojo sin aviso).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-suites:
    # Matriz: cada job compila y enlaza su propio grafo en paralelo. Los ~117
    # binarios de test en un solo job secuencial no caben en el techo (en
    # Windows cada binario de integración enlaza todo el grafo; la primera
    # corrida seguía compilando dependencias a los 19 min).
    name: unit-suites (${{ matrix.grupo }})
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - grupo: riesgo
            paquetes: -p risk-engine --lib --tests
          - grupo: nucleo
            paquetes: -p god-engine-core --lib --tests
          - grupo: espectro-y-consejo
            paquetes: -p quantum-arena -p signal-engine -p feature-engine -p metacortex-engine -p strategy-core --lib --tests
          - grupo: auditoria
            # Sol (2026-10-18): audit-engine no tenía shard — sus ~73 pruebas
            # (tribunal, auditor interno, F412/F413/F271) no corrían en CI.
            paquetes: -p audit-engine --lib --tests
          - grupo: entrenador
            # Sintético: ni entrenamiento, ni promoción, ni modelos reales.
            # SI: ejecutar también el contrato de ingestión del benchmark.
            paquetes: -p trader-gemini-v5 --lib --bin train_forest --bin spectral_bench
          - grupo: telemetria-servidor
            # F0/F1: rescata de AGY103 el crate aún no cubierto por Sol F1-095.
            # Los otros seis conservan su invocación completa y doctests en Replay.
            # Sin selectores: incluye lib, tests, bins y doctests del servidor.
            paquetes: -p telemetry-server
    env:
      # QS-P3: los runners windows-2022 tienen 4 vCPU y 16 GB. Con 2 jobs la
      # compilación (casi todo el tiempo del job: 23–31 min en el PR #30)
      # dejaba la mitad de la máquina parada.
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout candidate merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - name: Install the compiler used for the local regression
        run: |
          rustup toolchain install nightly-2026-06-30 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +nightly-2026-06-30 --version
      - name: Dependency duplicate inventory (F0)
        if: matrix.grupo == 'telemetria-servidor'
        # Metadata only, once per run; no unification across incompatible semver.
        run: cargo +nightly-2026-06-30 tree --workspace --duplicates --locked
      - name: Tests (${{ matrix.grupo }})
        run: cargo +nightly-2026-06-30 test ${{ matrix.paquetes }} --locked -- --test-threads=1
      - name: Terminal equity report contracts
        if: matrix.grupo == 'entrenador'
        # Exercise the production report with synthetic equity, without loading tapes.
        run: cargo +nightly-2026-06-30 test -p trader-gemini-v5 --bin backtest_windows --locked si_b15_report_contract -- --test-threads=1
      - name: Host OMS session contracts
        if: matrix.grupo == 'entrenador'
        # Synthetic sessions exercise the production gate without exchange I/O.
        run: cargo +nightly-2026-06-30 test -p trader-gemini-v5 --test host_oms_contract --locked -- --test-threads=1

  meta-analitica:
    # Sol (2026-10-19): los contratos de la meta-analítica del impacto
    # (RB-A1a + atribución por área) construyen repositorios git REALES en
    # carpetas temporales y verifican el libro de impacto, su determinismo y
    # el desglose por componente — pero NO corrían en ningún workflow: el
    # libro quedaba sin certificador en CI. Job aparte y barato: Python puro,
    # sin cargo, sin compilación (ubuntu, ~1 min).
    name: meta-analítica (contratos Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - name: Contratos de la meta-analítica (libro + áreas)
        # Se ejecuta el archivo directamente (tiene unittest.main()): evita
        # los problemas de discover sin __init__.py en scripts/tests.
        run: python3 scripts/tests/test_meta_analitica.py -v

  resource-safety:
    # QRA-02: los scripts reales operan sólo sobre árboles temporales de prueba.
    # Este job no compila Rust ni ejecuta higiene sobre el target del checkout.
    name: recursos (contratos Python y bash)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - name: GNU awk required by shared-target variant grouping
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk
      - name: Resource cleanup fail-closed contracts
        run: python3 scripts/tests/test_qra_resource_safety.py -v
      - name: Shared target cleanup regressions
        run: python3 scripts/tests/test_barrido_target.py -v
      - name: Build semaphore regressions
        run: python3 scripts/tests/test_cargo_semaforo.py -v
      - name: Hermetic process availability contracts
        run: |
          python3 scripts/tests/test_cargo_semaforo_fail_closed.py -v
          python3 scripts/tests/test_cargo_semaforo_enumerator_exit_status.py -v
