name: F7 resource launcher contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'build_loop.ps1'
      - 'run_sim_5.ps1'
      - 'scripts/t1_oraculo.sh'
      - 'scripts/cargo_semaforo.sh'
      - 'scripts/tests/test_t1_oraculo.py'
      - 'scripts/tests/test_t1_thread_formats.py'
      - 'scripts/tests/test_sim_launchers.py'
      - '.github/workflows/f7-resource-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'build_loop.ps1'
      - 'run_sim_5.ps1'
      - 'scripts/t1_oraculo.sh'
      - 'scripts/cargo_semaforo.sh'
      - 'scripts/tests/test_t1_oraculo.py'
      - 'scripts/tests/test_t1_thread_formats.py'
      - 'scripts/tests/test_sim_launchers.py'
      - '.github/workflows/f7-resource-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f7-resource-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  f7-resource-contracts:
    name: f7-resource-contracts (Windows Python + Cargo stubs)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.12'
      - name: Require native test dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          'C:\Program Files\Git\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; import shutil, sys; assert sys.platform == 'win32'; assert Path('C:/Program Files/Git/usr/bin/bash.exe').is_file(), 'Git Bash missing'; assert shutil.which('git'), 'Git missing'; assert Path('C:/Program Files/PowerShell/7/pwsh.exe').is_file(), 'PowerShell 7 missing'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: T1 wrapper contracts with Cargo stub
        run: |
          python scripts/tests/test_t1_oraculo.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: T1 thread format contracts with Cargo stub
        run: |
          python scripts/tests/test_t1_thread_formats.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell launcher contracts with Cargo stub
        run: |
          python scripts/tests/test_sim_launchers.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
