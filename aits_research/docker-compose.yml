version: '3.8'

services:
  # Capa 1: Series Temporales (OHLCV, Order Book, Trades)
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: aits_timescaledb
    environment:
      - POSTGRES_USER=aits_user
      - POSTGRES_PASSWORD=aits_pass
      - POSTGRES_DB=aits_market_data
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=1GB"]

  # Capa 1 y 5: Mensajería de Ultra-Baja Latencia (Event Bus)
  redis:
    image: redis:alpine
    container_name: aits_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  # Capa 2: Hypergraphs de Liquidez y Correlación
  neo4j:
    image: neo4j:5
    container_name: aits_neo4j
    environment:
      - NEO4J_AUTH=neo4j/aits_neo4j_pass
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    restart: unless-stopped

volumes:
  timescale_data:
  redis_data:
  neo4j_data:
  neo4j_plugins:
